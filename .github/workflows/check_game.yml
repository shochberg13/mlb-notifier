name: Check for MLB Condensed Game

on:
  schedule:
    - cron: '0 23 * * *'   # 6pm ET (11pm UTC) - catches early games
    - cron: '0 2 * * *'    # 9pm ET (2am UTC) - catches most games
    - cron: '0 10 * * *'   # 5am ET (10am UTC) - catches late west coast games
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run check
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MLB_TEAM: ${{ vars.MLB_TEAM }}
        run: python check_game.py

      - name: Commit seen_videos.json if updated
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_videos.json
          git diff --cached --quiet || git commit -m "Update seen videos" && git push
