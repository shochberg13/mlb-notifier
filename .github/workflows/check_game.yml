name: Check for MLB Condensed Game

on:
  schedule:
    - cron: '0 21 * * *'  # 5pm ET
    - cron: '0 22 * * *'  # 6pm ET
    - cron: '0 23 * * *'  # 7pm ET
    - cron: '0 0 * * *'   # 8pm ET
    - cron: '0 1 * * *'   # 9pm ET
    - cron: '0 2 * * *'   # 10pm ET
    - cron: '0 3 * * *'   # 11pm ET
    - cron: '0 4 * * *'   # midnight ET
    - cron: '0 7 * * *'   # 3am ET
    - cron: '0 8 * * *'   # 4am ET
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run check
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MLB_TEAM: ${{ vars.MLB_TEAM }}
        run: python check_game.py

      - name: Commit seen_videos.json if updated
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_videos.json
          git diff --cached --quiet || git commit -m "Update seen videos" && git push
